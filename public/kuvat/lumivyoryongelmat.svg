<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Viisi lumivyöryongelmaa</title>
  <desc id="d">Uusi lumi, tuulipatja, pysyvä heikko kerros, märkä lumi ja liukuva lumi rinteen poikkileikkauksina.</desc>
  <style>
    .s  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ink   { fill: #131c22; }
    .muted { fill: #586771; }
    .grid  { stroke: #dbe3e9; }
    .axis  { stroke: #b9c4cc; }
    .brand { stroke: #0b4a6f; }
    .brandf{ fill: #0b4a6f; }
    .band  { fill: #0b4a6f; opacity: .06; }
    .card  { fill: #ffffff; stroke: #dbe3e9; }
    .snow  { fill: #cfe0ea; }
    .snow2 { fill: #aec8d6; }
    .ground{ fill: #8fa3ad; }
    .good  { fill: #1a7a3c; }
    .bad   { fill: #b3261e; }
    .goods { stroke: #1a7a3c; }
    .bads  { stroke: #b3261e; }
    .hair  { stroke: rgba(11,11,11,.22); }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e6edf2; }
      .muted { fill: #94a5b1; }
      .grid  { stroke: #26333b; }
      .axis  { stroke: #3a4a55; }
      .brand { stroke: #7cc7ee; }
      .brandf{ fill: #7cc7ee; }
      .band  { fill: #7cc7ee; opacity: .10; }
      .card  { fill: #1a242b; stroke: #2c3a44; }
      .snow  { fill: #33454f; }
      .snow2 { fill: #47606d; }
      .ground{ fill: #5a6d78; }
      .good  { fill: #6ec27f; }
      .bad   { fill: #ef7a72; }
      .goods { stroke: #6ec27f; }
      .bads  { stroke: #ef7a72; }
      .hair  { stroke: rgba(255,255,255,.28); }
    }
  </style>

  <g class="s">
    <defs><marker id="tn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="brandf"/></marker></defs>
    <text class="ink" x="0" y="20" font-size="16" font-weight="700">Viisi lumivyöryongelmaa</text>
    <text class="muted" x="0" y="40" font-size="13">Ennuste kertoo aina, mikä ongelma on kyseessä ja missä se sijaitsee</text>
    <rect class="card" x="0" y="56" width="140" height="168" rx="10" stroke-width="1"/>
    <path class="ground" d="M14,140 L126,112 L126,146 L14,146 Z"/>
    <path class="snow2" d="M14,128 L126,100 L126,112 L14,140 Z"/>
    <path class="snow" d="M14,114 L126,86 L126,100 L14,128 Z"/>
    <text class="ink" x="14" y="170" font-size="13.5" font-weight="700">Uusi lumi</text>
    <text class="muted" x="14" y="190" font-size="11.5">Tuore kerros</text>
    <rect class="card" x="155" y="56" width="140" height="168" rx="10" stroke-width="1"/>
    <path class="ground" d="M169,140 L281,112 L281,146 L169,146 Z"/>
    <path class="snow2" d="M169,130 L281,104 L281,112 L169,140 Z"/>
    <path class="snow" d="M199,108 C229,92 249,96 281,104 L281,104 L199,130 Z"/>
    <path class="brand" d="M173,92 L203,100" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#tn)"/>
    <text class="ink" x="169" y="170" font-size="13.5" font-weight="700">Tuulipatja</text>
    <text class="muted" x="169" y="190" font-size="11.5">Tuuli kasaa laatan</text>
    <rect class="card" x="310" y="56" width="140" height="168" rx="10" stroke-width="1"/>
    <path class="ground" d="M324,140 L436,112 L436,146 L324,146 Z"/>
    <path class="snow" d="M324,114 L436,86 L436,112 L324,140 Z"/>
    <path class="bads" d="M324,132 L436,104" stroke-width="3" stroke-dasharray="4 4"/>
    <text class="ink" x="324" y="170" font-size="13.5" font-weight="700">Pysyvä heikko</text>
    <text class="ink" x="324" y="186" font-size="13.5" font-weight="700">kerros</text>
    <text class="muted" x="324" y="206" font-size="11.5">Syvällä hangessa</text>
    <rect class="card" x="465" y="56" width="140" height="168" rx="10" stroke-width="1"/>
    <path class="ground" d="M479,140 L591,112 L591,146 L479,146 Z"/>
    <path class="snow" d="M479,114 L591,86 L591,112 L479,140 Z"/>
    <line class="brand" x1="497" y1="90" x2="493" y2="114" stroke-width="1.6" opacity=".8"/>
    <line class="brand" x1="519" y1="90" x2="515" y2="114" stroke-width="1.6" opacity=".8"/>
    <line class="brand" x1="541" y1="90" x2="537" y2="114" stroke-width="1.6" opacity=".8"/>
    <line class="brand" x1="563" y1="90" x2="559" y2="114" stroke-width="1.6" opacity=".8"/>
    <text class="ink" x="479" y="170" font-size="13.5" font-weight="700">Märkä lumi</text>
    <text class="muted" x="479" y="190" font-size="11.5">Vesi heikentää</text>
    <rect class="card" x="620" y="56" width="140" height="168" rx="10" stroke-width="1"/>
    <path class="ground" d="M634,140 L746,112 L746,146 L634,146 Z"/>
    <path class="snow" d="M634,114 L746,86 L746,112 L634,140 Z"/>
    <path class="bads" d="M686,100 L692,126" stroke-width="3"/>
    <path class="brand" d="M700,108 L730,120" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#tn)"/>
    <text class="ink" x="634" y="170" font-size="13.5" font-weight="700">Liukuva lumi</text>
    <text class="muted" x="634" y="190" font-size="11.5">Hanki liukuu</text>
    <text class="muted" x="0" y="294" font-size="12.5">Suomessa yleisin on tuulipatja — se syntyy myös ilman lumisadetta.</text>
  </g>
</svg>
