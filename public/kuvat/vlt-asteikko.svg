<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Laskettelulasien suodatinluokat ja valonläpäisy</title>
  <desc id="d">Viisi suodatinluokkaa valonläpäisyn mukaan: luokka 0 päästää 80–100 prosenttia valosta, luokka 1 43–80, luokka 2 18–43, luokka 3 8–18 ja luokka 4 vain 3–8 prosenttia. Mitä tummempi linssi, sitä kirkkaampaan valoon. Luokka 4 ei sovi autolla ajoon.</desc>
  <style>
    .s  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ink   { fill: #131c22; }
    .muted { fill: #586771; }
    .grid  { stroke: #dbe3e9; }
    .axis  { stroke: #b9c4cc; }
    .brand { stroke: #0b4a6f; }
    .brandf{ fill: #0b4a6f; }
    .band  { fill: #0b4a6f; opacity: .06; }
    .card  { fill: #ffffff; stroke: #dbe3e9; }
    .good  { fill: #1a7a3c; }
    .bad   { fill: #b3261e; }
    .hair  { stroke: rgba(11,11,11,.22); }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e6edf2; }
      .muted { fill: #94a5b1; }
      .grid  { stroke: #26333b; }
      .axis  { stroke: #3a4a55; }
      .brand { stroke: #7cc7ee; }
      .brandf{ fill: #7cc7ee; }
      .band  { fill: #7cc7ee; opacity: .10; }
      .card  { fill: #1a242b; stroke: #2c3a44; }
      .good  { fill: #6ec27f; }
      .bad   { fill: #ef7a72; }
      .hair  { stroke: rgba(255,255,255,.28); }
    }
  </style>

  <g class="s">
    <text class="ink" x="0" y="20" font-size="16" font-weight="700">Suodatinluokat ja valonläpäisy (VLT)</text>
    <text class="muted" x="0" y="42" font-size="12.5">Pienempi VLT päästää vähemmän valoa läpi. Standardi EN ISO 18527-1.</text>
    <rect x="0" y="70" width="148" height="78" rx="8" fill="#eef5f9" class="hair" stroke-width="1"/>
    <text x="14" y="100" font-size="13" font-weight="700" fill="#131c22">LUOKKA 0</text>
    <text x="14" y="126" font-size="17" font-weight="700" fill="#131c22">80–100 %</text>
    <text x="14" y="142" font-size="11.5" fill="#131c22" opacity=".85">Kirkas linssi</text>
    <rect class="card" x="0" y="160" width="148" height="86" rx="8" stroke-width="1"/>
    <text class="muted" x="14" y="182" font-size="11" font-weight="700">KÄYTTÖ</text>
    <text class="ink" x="14" y="202" font-size="12">Yölasku, sakea</text>
    <text class="ink" x="14" y="219" font-size="12">pyry</text>
    <rect x="153" y="70" width="148" height="78" rx="8" fill="#c7dced" class="hair" stroke-width="1"/>
    <text x="167" y="100" font-size="13" font-weight="700" fill="#131c22">LUOKKA 1</text>
    <text x="167" y="126" font-size="17" font-weight="700" fill="#131c22">43–80 %</text>
    <text x="167" y="142" font-size="11.5" fill="#131c22" opacity=".85">Vaalea</text>
    <rect class="card" x="153" y="160" width="148" height="86" rx="8" stroke-width="1"/>
    <text class="muted" x="167" y="182" font-size="11" font-weight="700">KÄYTTÖ</text>
    <text class="ink" x="167" y="202" font-size="12">Tasainen valo,</text>
    <text class="ink" x="167" y="219" font-size="12">lumisade</text>
    <rect x="306" y="70" width="148" height="78" rx="8" fill="#7ea8c6" class="hair" stroke-width="1"/>
    <text x="320" y="100" font-size="13" font-weight="700" fill="#131c22">LUOKKA 2</text>
    <text x="320" y="126" font-size="17" font-weight="700" fill="#131c22">18–43 %</text>
    <text x="320" y="142" font-size="11.5" fill="#131c22" opacity=".85">Keskisävy</text>
    <rect class="card" x="306" y="160" width="148" height="86" rx="8" stroke-width="1"/>
    <text class="muted" x="320" y="182" font-size="11" font-weight="700">KÄYTTÖ</text>
    <text class="ink" x="320" y="202" font-size="12">Puolipilvinen,</text>
    <text class="ink" x="320" y="219" font-size="12">vaihteleva</text>
    <rect x="459" y="70" width="148" height="78" rx="8" fill="#3d7498" class="hair" stroke-width="1"/>
    <text x="473" y="100" font-size="13" font-weight="700" fill="#ffffff">LUOKKA 3</text>
    <text x="473" y="126" font-size="17" font-weight="700" fill="#ffffff">8–18 %</text>
    <text x="473" y="142" font-size="11.5" fill="#ffffff" opacity=".85">Tumma</text>
    <rect class="card" x="459" y="160" width="148" height="86" rx="8" stroke-width="1"/>
    <text class="muted" x="473" y="182" font-size="11" font-weight="700">KÄYTTÖ</text>
    <text class="ink" x="473" y="202" font-size="12">Kirkas aurinko</text>
    <text class="ink" x="473" y="219" font-size="12">lumella</text>
    <rect x="612" y="70" width="148" height="78" rx="8" fill="#15405a" class="hair" stroke-width="1"/>
    <text x="626" y="100" font-size="13" font-weight="700" fill="#ffffff">LUOKKA 4</text>
    <text x="626" y="126" font-size="17" font-weight="700" fill="#ffffff">3–8 %</text>
    <text x="626" y="142" font-size="11.5" fill="#ffffff" opacity=".85">Erittäin tumma</text>
    <rect class="card" x="612" y="160" width="148" height="86" rx="8" stroke-width="1"/>
    <text class="muted" x="626" y="182" font-size="11" font-weight="700">KÄYTTÖ</text>
    <text class="ink" x="626" y="202" font-size="12">Jäätikkö, korkea</text>
    <text class="ink" x="626" y="219" font-size="12">vuoristo</text>
    <line class="axis" x1="0" y1="268" x2="760" y2="268" stroke-width="1"/>
    <text class="muted" x="0" y="290" font-size="12">← vähemmän valoa ulkona</text>
    <text class="muted" x="760" y="290" font-size="12" text-anchor="end">enemmän valoa ulkona →</text>
    <text class="bad" x="0" y="320" font-size="13" font-weight="700">Luokka 4 ei sovi autolla ajoon. Ajoon tarvitaan luokka 0–3, hämärässä yli 75 % valonläpäisy.</text>
  </g>
</svg>
