    <line class="axis" x1="238.5" y1="300" x2="238.5" y2="306" stroke-width="1.5"/>
    <text class="muted" x="238.5" y="324" font-size="13" text-anchor="middle">30</text>
    <line class="axis" x1="401.0" y1="300" x2="401.0" y2="306" stroke-width="1.5"/>
    <text class="muted" x="401.0" y="324" font-size="13" text-anchor="middle">60</text>
    <line class="axis" x1="563.5" y1="300" x2="563.5" y2="306" stroke-width="1.5"/>
    <text class="muted" x="563.5" y="324" font-size="13" text-anchor="middle">90</text>
    <line class="axis" x1="726.0" y1="300" x2="726.0" y2="306" stroke-width="1.5"/>
