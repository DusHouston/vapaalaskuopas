<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Lumivyöryyn hautautuneen selviytymistodennäköisyys ajan funktiona</title>
  <desc id="d">Käyrä laskee noin 90 prosentista jyrkästi 10 ja 30 minuutin välillä ja tasaantuu sen jälkeen. Seurue ehtii pelastamaan keskimäärin 10 minuutissa, organisoitu pelastuspalvelu noin 90 minuutissa.</desc>
  <style>
    .s  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ink   { fill: #131c22; }
    .muted { fill: #586771; }
    .grid  { stroke: #dbe3e9; }
    .axis  { stroke: #b9c4cc; }
    .brand { stroke: #0b4a6f; }
    .brandf{ fill: #0b4a6f; }
    .band  { fill: #0b4a6f; opacity: .06; }
    .card  { fill: #ffffff; stroke: #dbe3e9; }
    .snow  { fill: #cfe0ea; }
    .snow2 { fill: #aec8d6; }
    .ground{ fill: #8fa3ad; }
    .good  { fill: #1a7a3c; }
    .bad   { fill: #b3261e; }
    .goods { stroke: #1a7a3c; }
    .bads  { stroke: #b3261e; }
    .hair  { stroke: rgba(11,11,11,.22); }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e6edf2; }
      .muted { fill: #94a5b1; }
      .grid  { stroke: #26333b; }
      .axis  { stroke: #3a4a55; }
      .brand { stroke: #7cc7ee; }
      .brandf{ fill: #7cc7ee; }
      .band  { fill: #7cc7ee; opacity: .10; }
      .card  { fill: #1a242b; stroke: #2c3a44; }
      .snow  { fill: #33454f; }
      .snow2 { fill: #47606d; }
      .ground{ fill: #5a6d78; }
      .good  { fill: #6ec27f; }
      .bad   { fill: #ef7a72; }
      .goods { stroke: #6ec27f; }
      .bads  { stroke: #ef7a72; }
      .hair  { stroke: rgba(255,255,255,.28); }
    }
  </style>

  <g class="s">
    <rect class="band" x="76.0" y="30" width="54.2" height="270"/>
    <rect class="band" x="238.5" y="30" width="325.0" height="270"/>
    <line class="grid" x1="76" y1="300.0" x2="726" y2="300.0" stroke-width="1"/>
    <text class="muted" x="64" y="304.0" font-size="13" text-anchor="end">0 %</text>
    <line class="grid" x1="76" y1="232.5" x2="726" y2="232.5" stroke-width="1"/>
    <text class="muted" x="64" y="236.5" font-size="13" text-anchor="end">25 %</text>
    <line class="grid" x1="76" y1="165.0" x2="726" y2="165.0" stroke-width="1"/>
    <text class="muted" x="64" y="169.0" font-size="13" text-anchor="end">50 %</text>
    <line class="grid" x1="76" y1="97.5" x2="726" y2="97.5" stroke-width="1"/>
    <text class="muted" x="64" y="101.5" font-size="13" text-anchor="end">75 %</text>
    <line class="grid" x1="76" y1="30.0" x2="726" y2="30.0" stroke-width="1"/>
