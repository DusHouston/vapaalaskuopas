    <rect class="band" x="261" y="358" width="11" height="11" rx="3"/>
    <text class="muted" x="278" y="367" font-size="12">Tukehtumisvaihe</text>
    <rect class="band" x="398" y="358" width="11" height="11" rx="3"/>
    <text class="muted" x="415" y="367" font-size="12">Latenssivaihe</text>
    <rect class="band" x="522" y="358" width="11" height="11" rx="3"/>
    <text class="muted" x="539" y="367" font-size="12">Pitkä hautautuminen</text>
    <path class="brand" d="M76.0,51.6 L103.1,51.6 L130.2,57.0 L146.4,78.6 L162.7,116.4 L184.3,159.6 L206.0,189.3 L227.7,208.2 L249.3,219.0 L292.7,224.4 L373.9,229.8 L455.2,232.5 L563.5,235.2 L617.7,251.4 L671.8,264.9 L726.0,275.7" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="brandf" cx="130.2" cy="57.0" r="5"/>
    <text class="ink" x="144.2" y="79.0" font-size="13" font-weight="600">10 min: n. 90 %</text>
    <circle class="brandf" cx="238.5" cy="219.0" r="5"/>
    <text class="ink" x="252.5" y="203.0" font-size="13" font-weight="600">30 min: jyrkkä lasku ohi</text>
    <line class="goods" x1="130.2" y1="30" x2="130.2" y2="300" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line class="bads" x1="563.5" y1="30" x2="563.5" y2="300" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="good" x="138.2" y="290" font-size="12.5" font-weight="600">Seurue ehtii tähän</text>
    <text class="bad" x="555.5" y="290" font-size="12.5" font-weight="600" text-anchor="end">Pelastuspalvelu saapuu</text>
    <text class="muted" x="76" y="418" font-size="11.5">Kaavio on suuntaa-antava. Käyrän muoto perustuu julkaistuun onnettomuusaineistoon.</text>
  </g>
</svg>
