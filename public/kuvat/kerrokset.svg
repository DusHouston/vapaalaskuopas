<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Vapaalaskun neljä vaatekerrosta</title>
  <desc id="d">Aluskerros siirtää kosteutta, välikerros eristää liikkeessä, kuori pysäyttää tuulen ja veden, ja lämpötakki eristää vain pysähdyksissä. Lämpötakki puetaan kuoren päälle.</desc>
  <style>
    .s  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ink   { fill: #131c22; }
    .muted { fill: #586771; }
    .grid  { stroke: #dbe3e9; }
    .axis  { stroke: #b9c4cc; }
    .brand { stroke: #0b4a6f; }
    .brandf{ fill: #0b4a6f; }
    .band  { fill: #0b4a6f; opacity: .06; }
    .card  { fill: #ffffff; stroke: #dbe3e9; }
    .good  { fill: #1a7a3c; }
    .bad   { fill: #b3261e; }
    .hair  { stroke: rgba(11,11,11,.22); }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e6edf2; }
      .muted { fill: #94a5b1; }
      .grid  { stroke: #26333b; }
      .axis  { stroke: #3a4a55; }
      .brand { stroke: #7cc7ee; }
      .brandf{ fill: #7cc7ee; }
      .band  { fill: #7cc7ee; opacity: .10; }
      .card  { fill: #1a242b; stroke: #2c3a44; }
      .good  { fill: #6ec27f; }
      .bad   { fill: #ef7a72; }
      .hair  { stroke: rgba(255,255,255,.28); }
    }
  </style>

  <g class="s">
    <defs><marker id="nk2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="brandf"/></marker></defs>
    <text class="ink" x="0" y="20" font-size="16" font-weight="700">Neljä kerrosta, neljä eri tehtävää</text>
    <rect class="card" x="0" y="40" width="175" height="215" rx="10" stroke-width="1"/>
    <rect class="band" x="16" y="58" width="143" height="30" rx="6"/>
    <text class="brandf" x="28" y="78" font-size="12.5" font-weight="700">1. ALUSKERROS</text>
    <text class="ink" x="16" y="116" font-size="13.5">Siirtää kosteuden</text>
    <text class="ink" x="16" y="134" font-size="13.5">pois iholta</text>
    <line class="grid" x1="16" y1="156" x2="159" y2="156" stroke-width="1"/>
    <text class="muted" x="16" y="178" font-size="11.5" font-weight="700">MILLOIN</text>
    <text class="muted" x="16" y="196" font-size="12">Päällä koko päivän</text>
    <text class="muted" x="16" y="224" font-size="11.5" font-weight="700">ESIMERKKI</text>
    <text class="muted" x="16" y="242" font-size="12">150–200 g/m²</text>
    <path class="brand" d="M178,148 L189,148" fill="none" stroke-width="2" marker-end="url(#nk2)"/>
    <rect class="card" x="195" y="40" width="175" height="215" rx="10" stroke-width="1"/>
    <rect class="band" x="211" y="58" width="143" height="30" rx="6"/>
    <text class="brandf" x="223" y="78" font-size="12.5" font-weight="700">2. VÄLIKERROS</text>
    <text class="ink" x="211" y="116" font-size="13.5">Eristää liikkeessä,</text>
    <text class="ink" x="211" y="134" font-size="13.5">päästää höyryn läpi</text>
    <line class="grid" x1="211" y1="156" x2="354" y2="156" stroke-width="1"/>
    <text class="muted" x="211" y="178" font-size="11.5" font-weight="700">MILLOIN</text>
    <text class="muted" x="211" y="196" font-size="12">Nousussa ja laskussa</text>
    <text class="muted" x="211" y="224" font-size="11.5" font-weight="700">ESIMERKKI</text>
    <text class="muted" x="211" y="242" font-size="12">Ristikkofleece</text>
    <path class="brand" d="M373,148 L384,148" fill="none" stroke-width="2" marker-end="url(#nk2)"/>
    <rect class="card" x="390" y="40" width="175" height="215" rx="10" stroke-width="1"/>
    <rect class="band" x="406" y="58" width="143" height="30" rx="6"/>
    <text class="brandf" x="418" y="78" font-size="12.5" font-weight="700">3. KUORI</text>
    <text class="ink" x="406" y="116" font-size="13.5">Pysäyttää tuulen</text>
    <text class="ink" x="406" y="134" font-size="13.5">ja veden</text>
    <line class="grid" x1="406" y1="156" x2="549" y2="156" stroke-width="1"/>
    <text class="muted" x="406" y="178" font-size="11.5" font-weight="700">MILLOIN</text>
    <text class="muted" x="406" y="196" font-size="12">Laskussa aina</text>
    <text class="muted" x="406" y="224" font-size="11.5" font-weight="700">ESIMERKKI</text>
    <text class="muted" x="406" y="242" font-size="12">3-kerros, kainalovetoketjut</text>
    <path class="brand" d="M568,148 L579,148" fill="none" stroke-width="2" marker-end="url(#nk2)"/>
    <rect class="card" x="585" y="40" width="175" height="215" rx="10" stroke-width="1"/>
    <rect class="band" x="601" y="58" width="143" height="30" rx="6"/>
    <text class="brandf" x="613" y="78" font-size="12.5" font-weight="700">4. LÄMPÖTAKKI</text>
    <text class="ink" x="601" y="116" font-size="13.5">Eristää paikallaan,</text>
    <text class="ink" x="601" y="134" font-size="13.5">pidettävä kuivana</text>
    <line class="grid" x1="601" y1="156" x2="744" y2="156" stroke-width="1"/>
    <text class="muted" x="601" y="178" font-size="11.5" font-weight="700">MILLOIN</text>
    <text class="muted" x="601" y="196" font-size="12">Vain pysähdyksissä</text>
    <text class="muted" x="601" y="224" font-size="11.5" font-weight="700">ESIMERKKI</text>
    <text class="muted" x="601" y="242" font-size="12">Kuoren päälle</text>
    <line class="axis" x1="0" y1="278" x2="760" y2="278" stroke-width="1"/>
    <text class="ink" x="0" y="302" font-size="13" font-weight="700">Kerrokset 1–3 ovat päällä liikkeessä. Kerros 4 vain silloin kun seisot.</text>
    <text class="muted" x="0" y="322" font-size="12">Lähde liikkeelle hieman kylmänä ja riisu kerros ennen kuin hikoilet — et sen jälkeen.</text>
  </g>
</svg>
