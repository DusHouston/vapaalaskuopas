<!DOCTYPE html>
<html lang="{{kieli}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{otsikko}}</title>
<meta name="description" content="{{kuvaus}}">
<link rel="canonical" href="{{kanoninen}}">
{{robots}}
<meta property="og:type" content="website">
<meta property="og:title" content="{{otsikko}}">
<meta property="og:description" content="{{kuvaus}}">
<meta property="og:url" content="{{kanoninen}}">
<meta property="og:site_name" content="{{sivustonimi}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="{{sivustonimi}}" href="/rss.xml">
<link rel="stylesheet" href="/tyylit.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
{{jsonld}}
</head>
<body>

<a class="ohita" href="#sisalto">Siirry sisältöön</a>

<header class="ylapalkki">
  <div class="kaari ylapalkki-sisus">
    <a class="logo" href="/">{{sivustonimi}}</a>
    <button class="valikkonappi" aria-label="Valikko" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="navi" aria-label="Päävalikko">
        {{navi}}
    </nav>
  </div>
</header>

<main id="sisalto" class="kaari">
{{murupolku}}
{{sisalto}}
</main>

<footer class="alapalkki">
  <div class="kaari">
    <div class="alapalkki-osiot">
      <div>
        <strong>{{sivustonimi}}</strong>
        <p>{{sivustokuvaus}}</p>
      </div>
      <nav aria-label="Alavalikko">
        <a href="/tietoa/">Tietoa sivustosta</a>
        <a href="/affiliate-linkit/">Kumppanuuslinkit</a>
        <a href="/tietosuoja/">Tietosuoja</a>
        <a href="/rss.xml">RSS</a>
      </nav>
    </div>
    <p class="copyright">&copy; {{vuosi}} {{sivustonimi}}. Sivusto sisältää kumppanuuslinkkejä.</p>
  </div>
</footer>

<script>
document.querySelector('.valikkonappi')?.addEventListener('click', function () {
  var auki = document.body.classList.toggle('valikko-auki');
  this.setAttribute('aria-expanded', auki);
});
</script>

</body>
</html>
